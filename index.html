<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#ffffff">
<meta name="description" content="사진, 바코드, QR 이미지를 직접 등록하고 실시간 한국 날짜와 시간을 확인하는 개인 회원 카드.">
<title>나의 회원 카드</title>
<style>
[hidden]{display:none!important}:root{--purple:#4900e7;--line:#e5dcff;--ink:#131313}*{box-sizing:border-box}body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #b793ff;outline-offset:4px}.app{max-width:480px;min-height:100svh;background:#fff;margin:auto;padding-bottom:28px}.header{height:78px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5;background:#fff}.header h1{font-size:17.1px;margin:0;font-weight:750}.icon-button{width:32px;height:40px;border:0;padding:3px;background:transparent;color:#222;display:grid;place-items:center}.icon-button svg{width:22.5px;height:22.5px}.banner{text-align:center;background:var(--purple);color:white;padding:22px 8px 36px;height:123px}.banner h2{margin:0 0 6px;font-size:22px;font-weight:400;letter-spacing:.3px}.banner p{margin:0;font-size:15px}.card{position:relative;width:82%;margin:-20px auto 0;border:1px solid #d9d9d9;border-radius:8px;background:#fff;box-shadow:3px 4px 4px #0002;padding:20px 15px 28px;text-align:center;overflow:visible}.refresh{position:absolute;right:-14px;top:-13px;border:none;border-radius:50%;background:#f0f0f0;width:36px;height:36px;display:grid;place-items:center;z-index:2}.refresh svg{width:24px;height:24px}.refresh.spinning svg{animation:turn .45s ease}@keyframes turn{to{transform:rotate(360deg)}}.barcode{width:94%;height:70px;display:block;margin:0 auto 20px}.photo-button{border:1px solid #e0e0e0;padding:0;background:#89b4d5;width:47%;aspect-ratio:3/4;display:block;position:relative;margin:0 auto;overflow:hidden}.portrait{height:100%;width:100%;object-fit:cover;display:block}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#8bb5d7,#c8ddea)}.placeholder svg{width:100%;height:100%}.photo-hint{position:absolute;bottom:0;left:0;right:0;background:#0006;color:white;font-size:11px;padding:5px}.name{font-size:23px;font-weight:800;margin:21px 0 8px}.relation{font-size:17px;margin:0 0 23px}.status{border:1px solid var(--line);border-radius:5px;background:#f9f6ff;color:var(--purple);font-size:17px;font-weight:800;padding:14px 2px}.date-row{display:flex;gap:10px;justify-content:center;align-items:baseline;white-space:nowrap;margin:5px 0 22px;font-size:16px;font-variant-numeric:tabular-nums}.time{color:#f00000;font-size:17px;font-weight:800}.benefits{display:flex;gap:7px;align-items:center;margin:0 6px}.qr{flex:0 0 31%;aspect-ratio:1;display:block}.benefit-list{flex:1;display:grid;gap:5px}.benefit{background:#f0f0f0;border-radius:4px;padding:11px 2px;font-size:15px;font-weight:750}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#242127;color:#fff;border-radius:10px;font-size:13px;padding:12px 18px;max-width:88%;width:max-content;z-index:10;box-shadow:0 5px 20px #0003}.toast[hidden]{display:none}dialog{width:min(88%,380px);border:0;border-radius:16px;padding:22px;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}dialog h2{margin:0 0 16px;font-size:20px}.crop-preview{width:120px;aspect-ratio:3/4;overflow:hidden;background:#c8ddea;margin:0 auto 20px}.crop-preview img{width:100%;height:100%;object-fit:cover}.range-row{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:13px}.range-row span{width:55px}input[type=range]{flex:1;min-width:0;accent-color:var(--purple)}.dialog-actions{display:flex;gap:8px;margin-top:20px}.dialog-actions button{flex:1;border:0;padding:12px;border-radius:8px}.primary{background:var(--purple);color:#fff}.noscript{margin:12px;text-align:center;color:#b00;font-size:13px}@media(min-width:481px){.app{box-shadow:0 0 30px #0001}.header{height:90px}.banner{height:138px;padding-top:26px}.banner h2{font-size:25px}.banner p{font-size:17px}.barcode{height:82px}.name{font-size:25px}.relation{font-size:19px}.status{font-size:20px}.date-row{font-size:19px}.time{font-size:20px}.benefit{font-size:18px;padding:14px 2px}}@media(max-width:350px){.date-row{font-size:14px;gap:7px}.time{font-size:15px}.status{font-size:15px}.benefit{font-size:13px}}

.code-button{padding:0;border:0;background:white;overflow:hidden}.code-image{width:100%;height:100%;object-fit:contain;display:block}.barcode-placeholder{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(90deg,#d0d0d0 0 3px,white 3px 6px,#d0d0d0 6px 8px,white 8px 13px)}.barcode-placeholder span{background:white;color:#777;padding:6px 10px;font-size:12px}.qr-placeholder{width:100%;height:100%;border:1px dashed #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#777}.qr-placeholder span{font-size:9px}.qr{flex-shrink:0}.portrait{background:white}
</style>
<style>
#layoutTrigger{user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}.app.layout-editing{padding-bottom:55svh}.layout-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:25;background:white;border:1px solid #e6def7;border-radius:20px 20px 0 0;box-shadow:0 -10px 45px #29134c26;padding:16px 20px calc(14px + env(safe-area-inset-bottom));max-height:54svh;display:flex;flex-direction:column}.layout-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.layout-heading h2{margin:0;font-size:17px}.layout-close{border:0;background:#f1edf8;color:#573596;padding:7px 12px;border-radius:7px;font-size:12px}.layout-intro{font-size:11px;color:#777;margin:6px 0 12px}.layout-tabs{display:flex;gap:4px;background:#f5f2f9;border-radius:9px;padding:4px}.layout-tabs button{border:0;background:transparent;border-radius:6px;padding:8px;flex:1;color:#777;font-size:12px}.layout-tabs button[aria-selected=true]{background:#fff;color:#4900e7;box-shadow:0 1px 4px #0001;font-weight:750}.layout-fields{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:70px;padding:5px 0 10px}.layout-control{display:grid;grid-template-columns:minmax(80px,1fr) 64px;align-items:center;gap:6px 12px;margin:12px 1px}.layout-control label{font-size:12px;color:#333}.layout-number{width:64px;padding:5px;border:1px solid #ded7ea;border-radius:6px;text-align:right;font-size:12px;appearance:textfield}.layout-range{grid-column:1/-1;width:100%;margin:0;min-height:24px}.layout-unit{font-size:10px;color:#999}.layout-actions{display:flex;gap:8px;border-top:1px solid #eee;padding-top:12px}.layout-actions button{font-size:12px;border:1px solid #e4dbee;border-radius:8px;padding:11px 12px;background:#faf8fd;color:#60448a}.layout-actions .download-layout{background:#4900e7;color:white;border-color:#4900e7;flex:1}.layout-editing .header{box-shadow:inset 0 0 0 1px #c7b5f1}.layout-tip{position:fixed;top:10px;right:10px;z-index:30}
</style>
<style id="layoutOverrides"></style>
<script id="layoutPreset" type="application/json">{}</script>
<script id="imagePreset" type="application/json">{}</script>
</head>
<body>
<main class="app">
 <header class="header">
  <button class="icon-button" id="back" aria-label="화면 안내"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <h1 id="layoutTrigger" role="button" tabindex="0" aria-label="나의정보, 길게 눌러 크기 조절" title="길게 눌러 크기 조절">나의정보</h1>
  <button class="icon-button" id="home" aria-label="맨 위로"><svg viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.6" stroke-linejoin="round"><path d="m2 10 10-8 10 8M5 8v14h14V8M9 22v-8h6v8"/></svg></button>
 </header>
 <section class="banner"><h2>국방복지 회원 증명</h2><p>※ 캡쳐된 화면 사용 불가능 합니다.</p></section>
 <article class="card" aria-label="개인 회원 카드">
  <button class="refresh" id="refresh" aria-label="현재 시간 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 7a8 8 0 1 1-1 9"/><path d="m5 3 0 5 5-1"/></svg></button>
  <button class="barcode code-button" id="barcodeButton" aria-label="바코드 이미지 선택 및 교체"><span class="barcode-placeholder" id="barcodePlaceholder"><span>바코드 이미지 선택</span></span><img class="code-image" id="barcodeImage" alt="등록한 바코드 이미지" hidden></button>
  <button class="photo-button" id="photoButton" aria-label="사진 선택 및 교체">
   <span class="placeholder" id="placeholder"><svg viewBox="0 0 150 200" aria-hidden="true"><path fill="#33495c" d="M8 200v-17c0-31 31-47 67-47s67 16 67 47v17"/><path fill="#f5f8fc" d="m51 133 24 12 24-12-13 67H64z"/><ellipse fill="#d7b699" cx="75" cy="86" rx="32" ry="43"/><path fill="#293742" d="M42 86V65c0-32 19-42 38-42 28 0 36 20 34 46l-8 22-5-27c-12 5-30 3-43-4l-10 29z"/></svg></span>
   <img id="portrait" class="portrait" alt="선택한 프로필 사진" hidden>
   <span class="photo-hint">눌러서 사진 변경</span>
  </button>
  <h2 class="name">김훈</h2><p class="relation">(김영식의 자)</p>
  <div class="status">승인완료(이용가능)</div>
  <div class="date-row"><span id="date">날짜 확인 중</span><time class="time" id="time">--:--:--</time></div>
  <div class="benefits">
   <button class="qr code-button" id="qrButton" aria-label="QR 이미지 선택 및 교체"><span class="qr-placeholder" id="qrPlaceholder"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M12 8v8M8 12h8"/></svg><span>QR 이미지 선택</span></span><img class="code-image" id="qrImage" alt="등록한 QR 이미지" hidden></button>
   <div class="benefit-list"><div class="benefit">마트 이용 가능</div><div class="benefit">호텔콘도 이용 가능</div></div>
  </div>
 </article>
 <input type="file" id="imageInput" accept="image/*" hidden>
 <noscript><p class="noscript">실시간 시간과 사진 변경을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
</main>
<dialog id="cropDialog"><h2>사진 위치 조절</h2><div class="crop-preview"><img id="cropImage" alt="사진 위치 미리보기"></div><label class="range-row"><span>확대</span><input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label><label class="range-row"><span>가로 위치</span><input id="posX" type="range" min="0" max="100" value="50"></label><label class="range-row"><span>세로 위치</span><input id="posY" type="range" min="0" max="100" value="50"></label><div class="dialog-actions"><button id="cancelCrop">취소</button><button id="saveCrop" class="primary">적용</button></div></dialog>
<aside id="layoutPanel" class="layout-panel" aria-label="크기 조절 패널" hidden>
 <div class="layout-heading"><h2>크기 조절</h2><button id="closeLayout" class="layout-close">닫기</button></div>
 <p class="layout-intro">슬라이더로 조절하면 자동 저장됩니다. 위치의 −는 왼쪽·위, +는 오른쪽·아래입니다.</p>
 <div class="layout-tabs" role="tablist" aria-label="조절할 영역"><button id="layoutTabHeader" role="tab" aria-selected="true" aria-controls="layoutFields" data-section="header">상단 바</button><button id="layoutTabText" role="tab" aria-selected="false" aria-controls="layoutFields" data-section="text">글씨</button><button id="layoutTabCard" role="tab" aria-selected="false" aria-controls="layoutFields" data-section="card">카드·배치</button></div>
 <div id="layoutFields" class="layout-fields" role="tabpanel" aria-labelledby="layoutTabHeader"></div>
 <div class="layout-actions"><button id="resetLayout">기본 크기로</button><button id="downloadLayout" class="download-layout">수정한 HTML 저장</button></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const storageKey='member-ui-sample-photo-v1';
const assets={photo:null,barcode:null,qr:null};
let position={zoom:1,x:50,y:50},activeType='photo',toastTimer;
const dateFormatter=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'});
const timeFormatter=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function tick(){const now=new Date(),parts=dateFormatter.formatToParts(now);const part=t=>parts.find(p=>p.type===t).value;$('date').textContent=`${part('year')}년 ${part('month')}월 ${part('day')}일`;$('time').textContent=timeFormatter.format(now);$('time').dateTime=now.toISOString()}
tick();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function imageStyle(img,p){img.style.objectPosition=`${p.x}% ${p.y}%`;img.style.transform=`scale(${p.zoom})`;img.style.transformOrigin=`${p.x}% ${p.y}%`}
function keyFor(type){return type==='photo'?storageKey:`member-card-image-${type}-v1`}
function persist(type){try{const value=type==='photo'?JSON.stringify({photo:assets.photo,position}):assets[type];localStorage.setItem(keyFor(type),value);return true}catch{return false}}
function render(type){const isPhoto=type==='photo';const img=$(isPhoto?'portrait':`${type}Image`),placeholder=$(isPhoto?'placeholder':`${type}Placeholder`);img.hidden=!assets[type];placeholder.hidden=!!assets[type];if(assets[type]){img.src=assets[type];if(isPhoto)imageStyle(img,position)}else img.removeAttribute('src');if(isPhoto)placeholder.style.display=assets.photo?'none':'flex'}
let embeddedImages={};try{embeddedImages=JSON.parse($('imagePreset').textContent||'{}')}catch{}
if(embeddedImages.position)position=embeddedImages.position;
for(const type of ['photo','barcode','qr']){if(embeddedImages.assets?.[type]?.startsWith('data:image/'))assets[type]=embeddedImages.assets[type];try{const raw=localStorage.getItem(keyFor(type));if(type==='photo'){const saved=JSON.parse(raw||'null');if(saved?.photo?.startsWith('data:image/')){assets.photo=saved.photo;if(saved.position)position=saved.position}}else if(raw?.startsWith('data:image/'))assets[type]=raw}catch{}render(type)}
function chooseImage(type){activeType=type;$('imageInput').click()}
$('photoButton').addEventListener('click',()=>chooseImage('photo'));
$('barcodeButton').addEventListener('click',()=>chooseImage('barcode'));
$('qrButton').addEventListener('click',()=>chooseImage('qr'));
function openCrop(){$('cropImage').src=assets.photo;$('zoom').value=position.zoom;$('posX').value=position.x;$('posY').value=position.y;imageStyle($('cropImage'),position);$('cropDialog').showModal()}
$('imageInput').addEventListener('change',async e=>{const file=e.target.files[0],type=activeType;if(!file)return;if(file.size>30*1024*1024){toast('30MB 이하의 이미지를 선택해 주세요.');e.target.value='';return}const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const maxSize=type==='photo'?720:1600;const ratio=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);assets[type]=type==='photo'?canvas.toDataURL('image/jpeg',.88):canvas.toDataURL('image/png');if(type==='photo')position={zoom:1,x:50,y:50};render(type);const saved=persist(type);toast(saved?'이미지가 등록되었습니다.':'이미지가 등록되었습니다. 이 브라우저에서는 저장이 제한되어 새로고침하면 사라집니다.');if(type==='photo')openCrop()}catch{toast('이미지를 열 수 없습니다. JPG 또는 PNG 파일을 선택해 주세요.')}finally{URL.revokeObjectURL(url);e.target.value=''}});
function currentPosition(){return{zoom:Number($('zoom').value),x:Number($('posX').value),y:Number($('posY').value)}}
for(const id of ['zoom','posX','posY'])$(id).addEventListener('input',()=>imageStyle($('cropImage'),currentPosition()));
$('cancelCrop').addEventListener('click',()=>$('cropDialog').close());$('saveCrop').addEventListener('click',()=>{position=currentPosition();render('photo');const saved=persist('photo');$('cropDialog').close();toast(saved?'사진 위치가 저장되었습니다.':'위치가 적용되었습니다. 브라우저 저장이 제한되어 있습니다.')});
$('refresh').addEventListener('click',()=>{tick();$('refresh').classList.remove('spinning');void $('refresh').offsetWidth;$('refresh').classList.add('spinning');toast('현재 한국 시간으로 갱신했습니다.')});
$('home').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));$('back').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

// Direct, browser-local appearance controls.
const layoutDefinitions=[
 ['headerTitle','상단 제목 글씨','header',17.1,12,28,.1,'px'],
 ['headerHeight','상단 바 높이','header',78,50,115,1,'px'],
 ['homeX','집 아이콘 가로','header',100,40,160,1,'%'],
 ['homeY','집 아이콘 세로','header',100,40,160,1,'%'],
 ['homeOffsetX','집 아이콘 좌우 위치','header',0,-80,20,1,'px'],
 ['homeOffsetY','집 아이콘 상하 위치','header',0,-24,24,1,'px'],
 ['backX','뒤로가기 아이콘 가로','header',100,40,160,1,'%'],
 ['backY','뒤로가기 아이콘 세로','header',100,40,160,1,'%'],
 ['bannerTitle','보라색 영역 제목','text',22,14,32,.5,'px'],
 ['bannerSubtitle','보라색 영역 설명','text',15,10,22,.5,'px'],
 ['nameSize','이름','text',23,16,32,.5,'px'],
 ['relationSize','이름 아래 문구','text',17,11,24,.5,'px'],
 ['statusSize','회원 카드 문구','text',17,11,25,.5,'px'],
 ['dateSize','날짜','text',16,11,22,.5,'px'],
 ['timeSize','시간','text',17,11,23,.5,'px'],
 ['benefitSize','아래 두 칸 문구','text',15,10,22,.5,'px'],
 ['cardWidth','카드 전체 가로폭','card',82,70,91,1,'%'],
 ['photoWidth','사진 크기','card',47,30,65,1,'%'],
 ['bannerHeight','보라색 영역 높이','card',123,100,190,1,'px'],
 ['barcodeHeight','바코드 영역 높이','card',70,40,110,1,'px'],
 ['qrWidth','QR 영역 크기','card',31,22,40,1,'%'],
 ['statusHeight','회원 카드 칸 높이','card',14,8,24,1,'px'],
 ['benefitHeight','아래 두 칸 높이','card',11,6,22,1,'px']
];
const layoutKey='member-card-layout-v1';
const layoutDefaults=Object.fromEntries(layoutDefinitions.map(d=>[d[0],d[3]]));
function normalizeLayout(input){const result={...layoutDefaults};if(input&&typeof input==='object')for(const [key,label,section,def,min,max,step]of layoutDefinitions){const v=input[key];if(typeof v==='number'&&Number.isFinite(v))result[key]=Number((Math.min(max,Math.max(min,v))/step).toFixed(0))*step}return result}
let layoutInput={};try{layoutInput=JSON.parse($('layoutPreset').textContent||'{}')}catch{}
try{const savedLayout=JSON.parse(localStorage.getItem(layoutKey)||'null');if(savedLayout)layoutInput=savedLayout}catch{}
let layout=normalizeLayout(layoutInput),layoutSection='header',layoutSaveWarning=false;
function applyLayout(){const p=layout;$('layoutOverrides').textContent=`
.header{height:${p.headerHeight}px}.header h1{font-size:${p.headerTitle}px}
.header #home{transform:translate(${p.homeOffsetX}px,${p.homeOffsetY}px)}.header #home svg{transform:scale(${p.homeX/100},${p.homeY/100})}.header #back svg{transform:scale(${p.backX/100},${p.backY/100})}
.banner{height:${p.bannerHeight}px}.banner h2{font-size:${p.bannerTitle}px}.banner p{font-size:${p.bannerSubtitle}px}
.card{width:${p.cardWidth}%}.photo-button{width:${p.photoWidth}%}.name{font-size:${p.nameSize}px}.relation{font-size:${p.relationSize}px}
.status{font-size:${p.statusSize}px;padding-top:${p.statusHeight}px;padding-bottom:${p.statusHeight}px}.date-row{font-size:${p.dateSize}px;gap:clamp(3px,1vw,10px);flex-wrap:wrap;row-gap:1px}.time{font-size:${p.timeSize}px}
.benefit{font-size:${p.benefitSize}px;padding-top:${p.benefitHeight}px;padding-bottom:${p.benefitHeight}px}.barcode{height:${p.barcodeHeight}px}.qr{flex-basis:${p.qrWidth}%}
`;}
function saveLayout(){try{localStorage.setItem(layoutKey,JSON.stringify(layout));return true}catch{if(!layoutSaveWarning){toast('변경은 적용됐지만 브라우저 저장이 제한됩니다. HTML 저장 버튼을 이용해 주세요.');layoutSaveWarning=true}return false}}
function updateLayout(key,value){layout=normalizeLayout({...layout,[key]:Number(value)});applyLayout();saveLayout()}
function renderLayoutFields(){const fields=$('layoutFields');fields.replaceChildren();for(const [key,label,section,def,min,max,step,unit]of layoutDefinitions){if(section!==layoutSection)continue;const row=document.createElement('div');row.className='layout-control';const labelEl=document.createElement('label');labelEl.htmlFor='layout-range-'+key;labelEl.textContent=label+' ('+unit+')';const number=document.createElement('input');number.type='number';number.className='layout-number';number.min=min;number.max=max;number.step=step;number.value=Number(layout[key].toFixed(2));number.setAttribute('aria-label',label+' 수치');const range=document.createElement('input');range.id='layout-range-'+key;range.type='range';range.className='layout-range';range.min=min;range.max=max;range.step=step;range.value=layout[key];range.addEventListener('input',()=>{updateLayout(key,range.value);number.value=Number(layout[key].toFixed(2))});number.addEventListener('change',()=>{if(number.value===''){number.value=layout[key];return}updateLayout(key,number.value);number.value=Number(layout[key].toFixed(2));range.value=layout[key]});row.append(labelEl,number,range);fields.appendChild(row)}fields.scrollTop=0;for(const id of ['layoutTabHeader','layoutTabText','layoutTabCard'])$(id).setAttribute('aria-selected',String($(id).dataset.section===layoutSection));fields.setAttribute('aria-labelledby',layoutSection==='header'?'layoutTabHeader':layoutSection==='text'?'layoutTabText':'layoutTabCard')}
function openLayout(){$('layoutPanel').hidden=false;document.querySelector('.app').classList.add('layout-editing');renderLayoutFields()}
function closeLayout(){$('layoutPanel').hidden=true;document.querySelector('.app').classList.remove('layout-editing');$('layoutTrigger').focus()}
$('closeLayout').addEventListener('click',closeLayout);
for(const id of ['layoutTabHeader','layoutTabText','layoutTabCard'])$(id).addEventListener('click',()=>{layoutSection=$(id).dataset.section;renderLayoutFields()});
$('resetLayout').addEventListener('click',()=>{layout={...layoutDefaults};applyLayout();saveLayout();renderLayoutFields();toast('기본 크기로 되돌렸습니다.')});
let holdTimer,holdStart;
const trigger=$('layoutTrigger');
function cancelHold(){clearTimeout(holdTimer);holdTimer=undefined}
trigger.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;cancelHold();holdStart={x:e.clientX,y:e.clientY};holdTimer=setTimeout(()=>{openLayout();holdTimer=undefined},600)});
trigger.addEventListener('pointermove',e=>{if(holdTimer&&holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>10)cancelHold()});
for(const event of ['pointerup','pointercancel','pointerleave'])trigger.addEventListener(event,cancelHold);
trigger.addEventListener('contextmenu',e=>e.preventDefault());trigger.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLayout()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('layoutPanel').hidden)closeLayout()});
$('downloadLayout').addEventListener('click',()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#layoutPreset').textContent=JSON.stringify(layout);clone.querySelector('#imagePreset').textContent=JSON.stringify({assets,position});clone.querySelector('#layoutPanel').hidden=true;clone.querySelector('.app').classList.remove('layout-editing');clone.querySelector('#toast').hidden=true;clone.querySelector('#cropDialog').removeAttribute('open');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='member-card-custom.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('HTML 파일을 저장하거나 공유할 수 있습니다.')});
applyLayout();
</script>
