<dialog id="cropDialog"><h2>사진 위치 조절</h2><div class="crop-preview"><img id="cropImage" alt="사진 위치 미리보기"></div><label class="range-row"><span>확대</span><input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label><label class="range-row"><span>가로 위치</span><input id="posX" type="range" min="0" max="100" value="50"></label><label class="range-row"><span>세로 위치</span><input id="posY" type="range" min="0" max="100" value="50"></label><div class="dialog-actions"><button id="cancelCrop">취소</button><button id="saveCrop" class="primary">적용</button></div></dialog>
<aside id="layoutPanel" class="layout-panel" aria-label="크기 조절 패널" hidden="">
 <div class="layout-heading"><h2>크기 조절</h2><button id="closeLayout" class="layout-close">닫기</button></div>
 <p class="layout-intro">슬라이더로 조절하면 이 브라우저에 자동 저장됩니다. 위치의 −는 왼쪽·위, +는 오른쪽·아래입니다.</p>
 <div class="layout-tabs" role="tablist" aria-label="조절할 영역"><button id="layoutTabHeader" role="tab" aria-selected="true" aria-controls="layoutFields" data-section="header">상단 바</button><button id="layoutTabText" role="tab" aria-selected="false" aria-controls="layoutFields" data-section="text">글씨</button><button id="layoutTabCard" role="tab" aria-selected="false" aria-controls="layoutFields" data-section="card">카드·배치</button></div>
 <div id="layoutFields" class="layout-fields" role="tabpanel" aria-labelledby="layoutTabHeader"></div>
 <div class="layout-actions"><button id="resetLayout">기본 크기로</button><button id="finishEditing" class="download-layout">편집 완료</button></div>
</aside>
<div id="editBar" class="edit-bar" hidden><span>편집 모드</span><button id="lockEditing">편집 완료</button></div>
<div class="toast" id="toast" role="status" hidden=""></div>

<script>'use strict';
const $=id=>document.getElementById(id);
let profile=JSON.parse($('profilePreset').textContent),editing=false,toastTimer;
let saveChain=Promise.resolve(),inFlight=0,lastSaveFailed=false;
const textTimers={};
// Each browser and page path has its own saved card. No network API is used.
const localCardKey='current:'+((location.pathname||'/').replace(/\/index\.html$/, '/').replace(/\/$/, '')||'/');
let localDatabasePromise;
function openLocalDatabase(){
 if(!localDatabasePromise)localDatabasePromise=new Promise((resolve,reject)=>{
  if(typeof indexedDB==='undefined'){reject(new Error('브라우저 저장소를 사용할 수 없습니다.'));return}
  const request=indexedDB.open('member-card-local-v1',1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('cards'))request.result.createObjectStore('cards')};
  request.onerror=()=>reject(request.error||new Error('브라우저 저장소를 열지 못했습니다.'));
  request.onblocked=()=>reject(new Error('다른 탭을 닫은 후 다시 시도해 주세요.'));
  request.onsuccess=()=>{const database=request.result;database.onversionchange=()=>{database.close();localDatabasePromise=null};resolve(database)};
 }).catch(error=>{localDatabasePromise=null;throw error});
 return localDatabasePromise;
}
async function localStorageTransaction(mode,value){
 const database=await openLocalDatabase();
 return new Promise((resolve,reject)=>{
  const transaction=database.transaction('cards',mode),store=transaction.objectStore('cards');let result;
  transaction.oncomplete=()=>resolve(result);
  transaction.onabort=()=>reject(transaction.error||new Error('브라우저 저장이 중단되었습니다.'));
  transaction.onerror=()=>reject(transaction.error||new Error('브라우저 저장에 실패했습니다.'));
  const request=mode==='readwrite'?store.put(value,localCardKey):store.get(localCardKey);
  request.onsuccess=()=>{result=request.result};
 });
}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function tick(){const now=new Date(),d=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now),part=t=>d.find(p=>p.type===t).value;$('date').textContent=`${part('year')}년 ${part('month')}월 ${part('day')}일`;$('time').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);$('time').dateTime=now.toISOString()}
tick();setInterval(tick,1000);
function imageStyle(img,p){img.style.objectPosition=`${p.x}% ${p.y}%`;img.style.transform=`scale(${p.zoom})`;img.style.transformOrigin=`${p.x}% ${p.y}%`}
function renderPhoto(){const img=$('portrait');img.hidden=!profile.photo;$('placeholder').hidden=!!profile.photo;$('placeholder').style.display=profile.photo?'none':'flex';if(profile.photo){img.src=profile.photo;imageStyle(img,profile.position)}else img.removeAttribute('src')}
function renderCodes(){for(const type of ['barcode','qr']){const img=$(type+'Image'),empty=$(type+'Placeholder');img.hidden=!profile[type];empty.hidden=!!profile[type];if(profile[type])img.src=profile[type];else img.removeAttribute('src')}}
function renderProfile(){$('nameText').textContent=profile.name;$('bioText').textContent=profile.bio;renderPhoto();renderCodes();layout=normalizeLayout(profile.layout);applyLayout()}
async function savePatch(patch){
 if(!editing)throw new Error('편집 모드에서 변경해 주세요.');
 inFlight++;lastSaveFailed=false;
 const operation=saveChain.catch(()=>{}).then(async()=>{
  const next={...profile,...patch,updatedAt:new Date().toISOString()};
  await localStorageTransaction('readwrite',next);
  profile=next;return next;
 });
 saveChain=operation;
 try{return await operation}catch(error){lastSaveFailed=true;toast('이 브라우저에 저장하지 못했습니다. 저장 공간과 사이트 데이터 설정을 확인해 주세요.');throw error}finally{inFlight--}
}
async function loadProfile(){
 try{
  const saved=await localStorageTransaction('readonly');
  if(saved&&typeof saved==='object'&&!Array.isArray(saved))profile={...profile,...saved,layout:{...profile.layout,...saved.layout}};
  renderProfile();
 }catch{toast('브라우저 저장소를 열지 못했습니다. Safari에서 웹주소로 열어 주세요.')}
}
function setEditing(enabled){editing=enabled;document.querySelector('.app').classList.toggle('editing',enabled);$('editBar').hidden=!enabled;for(const id of ['photoButton','barcodeButton','qrButton','back'])$(id).disabled=!enabled;$('layoutTrigger').setAttribute('tabindex',enabled?'0':'-1');if(enabled)$('layoutTrigger').setAttribute('role','button');else $('layoutTrigger').removeAttribute('role');for(const id of ['nameText','bioText']){$(id).setAttribute('contenteditable',enabled?'plaintext-only':'false');$(id).setAttribute('tabindex',enabled?'0':'-1')}if(!enabled){$('layoutPanel').hidden=true;document.querySelector('.app').classList.remove('layout-editing');$('cropDialog').close()}toast(enabled?'편집 모드가 켜졌습니다.':'편집 모드가 종료되었습니다.')}
async function lockEditing(){await flushTexts();clearTimeout(layoutTimer);if(JSON.stringify(layout)!==JSON.stringify(profile.layout)){try{await savePatch({layout:{...layout}})}catch{return}}await saveChain.catch(()=>{});if(lastSaveFailed||fieldValue('nameText')!==profile.name||fieldValue('bioText')!==profile.bio)return;setEditing(false)}
$('lockEditing').addEventListener('click',lockEditing);$('finishEditing').addEventListener('click',lockEditing);
let tapCount=0,lastTap=0;
$('home').addEventListener('click',async()=>{const now=Date.now();tapCount=now-lastTap<1000?tapCount+1:1;lastTap=now;if(tapCount<4)return;tapCount=0;await profileReady;if(editing)await lockEditing();else setEditing(true)});
function fieldValue(id){return $(id).textContent.replace(/\n/g,' ').trim()}
async function saveText(id,key,max){clearTimeout(textTimers[id]);const text=fieldValue(id);if(!editing||text===profile[key])return;if(key==='name'&&!text){$(id).textContent=profile.name;toast('이름을 입력해 주세요.');return}if(text.length>max){toast(`${max}자 이하로 입력해 주세요.`);return}try{await savePatch({[key]:text})}catch{}}
async function flushTexts(){await saveText('nameText','name',80);await saveText('bioText','bio',200)}
for(const [id,key,max]of [['nameText','name',80],['bioText','bio',200]]){$(id).addEventListener('input',()=>{if(!editing)return;clearTimeout(textTimers[id]);textTimers[id]=setTimeout(()=>saveText(id,key,max),700)});$(id).addEventListener('blur',()=>saveText(id,key,max));$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$(id).blur()}})}
let activeImageKind='photo';
for(const kind of ['photo','barcode','qr'])$(kind+'Button').addEventListener('click',()=>{if(!editing)return;activeImageKind=kind;$('imageInput').click()});
$('imageInput').addEventListener('change',async e=>{const file=e.target.files[0],kind=activeImageKind;if(!file||!editing)return;if(file.size>30*1024*1024){toast('30MB 이하의 사진을 선택해 주세요.');e.target.value='';return}const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const ratio=Math.min(1,(kind==='photo'?720:1600)/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const value=kind==='photo'?canvas.toDataURL('image/jpeg',.9):canvas.toDataURL('image/png'),patch={[kind]:value};if(kind==='photo')patch.position={zoom:1,x:50,y:50};toast('이미지를 저장하는 중입니다.');await savePatch(patch);renderPhoto();renderCodes();toast('이미지가 저장되었습니다.');if(kind==='photo')openCrop()}catch(e){if(!lastSaveFailed)toast('사진을 열 수 없습니다. JPG 또는 PNG 사진을 선택해 주세요.')}finally{URL.revokeObjectURL(url);e.target.value=''}});
function currentPosition(){return{zoom:Number($('zoom').value),x:Number($('posX').value),y:Number($('posY').value)}}
function openCrop(){if(!editing)return;$('cropImage').src=profile.photo;$('zoom').value=profile.position.zoom;$('posX').value=profile.position.x;$('posY').value=profile.position.y;imageStyle($('cropImage'),profile.position);$('cropDialog').showModal()}
for(const id of ['zoom','posX','posY'])$(id).addEventListener('input',()=>imageStyle($('cropImage'),currentPosition()));
$('cancelCrop').addEventListener('click',()=>$('cropDialog').close());$('saveCrop').addEventListener('click',async()=>{if(!editing)return;try{await savePatch({position:currentPosition()});renderPhoto();$('cropDialog').close();toast('사진 위치가 저장되었습니다.')}catch{}});
$('photoButton').addEventListener('contextmenu',e=>{e.preventDefault();if(editing&&profile.photo)openCrop()});
async function reloadPage(){
 if(editing){
  await flushTexts();clearTimeout(layoutTimer);
  if(JSON.stringify(layout)!==JSON.stringify(profile.layout))try{await savePatch({layout:{...layout}})}catch{return}
 }
 await saveChain.catch(()=>{});
 if(lastSaveFailed){toast('저장에 실패한 변경 내용을 확인한 후 새로고침해 주세요.');return}
 location.reload();
}
$('refresh').addEventListener('click',reloadPage);$('back').addEventListener('click',()=>{if(editing)window.scrollTo({top:0,behavior:'smooth'})});
const layoutDefinitions=[
 ['headerTitle','상단 제목 글씨','header',17.1,12,28,.1,'px'],
 ['headerHeight','상단 바 높이','header',78,50,115,1,'px'],
 ['homeX','집 아이콘 가로','header',100,40,160,1,'%'],
 ['homeY','집 아이콘 세로','header',100,40,160,1,'%'],
 ['homeOffsetX','집 아이콘 좌우 위치','header',0,-80,20,1,'px'],
 ['homeOffsetY','집 아이콘 상하 위치','header',0,-24,24,1,'px'],
 ['backX','뒤로가기 아이콘 가로','header',100,40,160,1,'%'],
 ['backY','뒤로가기 아이콘 세로','header',100,40,160,1,'%'],
 ['bannerTitle','보라색 영역 제목','text',22,14,32,.5,'px'],
 ['bannerSubtitle','보라색 영역 설명','text',15,10,22,.5,'px'],
 ['nameSize','이름','text',23,16,32,.5,'px'],
 ['relationSize','이름 아래 문구','text',17,11,24,.5,'px'],
 ['statusSize','회원 카드 문구','text',17,11,25,.5,'px'],
 ['dateSize','날짜','text',16,11,22,.5,'px'],
 ['timeSize','시간','text',17,11,23,.5,'px'],
 ['benefitSize','아래 두 칸 문구','text',15,10,22,.5,'px'],
 ['cardWidth','카드 전체 가로폭','card',82,70,91,1,'%'],
 ['photoWidth','사진 크기','card',47,30,65,1,'%'],
 ['bannerHeight','보라색 영역 높이','card',123,100,190,1,'px'],
 ['barcodeHeight','바코드 영역 높이','card',70,40,110,1,'px'],
 ['qrWidth','QR 영역 크기','card',31,22,40,1,'%'],
 ['statusHeight','회원 카드 칸 높이','card',14,8,24,1,'px'],
 ['benefitHeight','아래 두 칸 높이','card',11,6,22,1,'px']
];
const layoutDefaults=Object.fromEntries(layoutDefinitions.map(d=>[d[0],d[3]]));
function normalizeLayout(input){const result={...layoutDefaults};if(input&&typeof input==='object')for(const [key,label,section,def,min,max,step]of layoutDefinitions){const v=input[key];if(typeof v==='number'&&Number.isFinite(v))result[key]=Number((Math.min(max,Math.max(min,v))/step).toFixed(0))*step}return result}
let layout=normalizeLayout(profile.layout),layoutSection='header',layoutTimer;
function applyLayout(){const p=layout;$('layoutOverrides').textContent=`.header{height:${p.headerHeight}px}.header h1{font-size:${p.headerTitle}px}.header #home{transform:translate(${p.homeOffsetX}px,${p.homeOffsetY}px)}.header #home svg{transform:scale(${p.homeX/100},${p.homeY/100})}.header #back svg{transform:scale(${p.backX/100},${p.backY/100})}.banner{height:${p.bannerHeight}px}.banner h2{font-size:${p.bannerTitle}px}.banner p{font-size:${p.bannerSubtitle}px}.card{width:${p.cardWidth}%}.photo-button{width:${p.photoWidth}%}.name{font-size:${p.nameSize}px}.relation{font-size:${p.relationSize}px}.status{font-size:${p.statusSize}px;padding-top:${p.statusHeight}px;padding-bottom:${p.statusHeight}px}.date-row{font-size:${p.dateSize}px;gap:clamp(3px,1vw,10px);flex-wrap:wrap;row-gap:1px}.time{font-size:${p.timeSize}px}.benefit{font-size:${p.benefitSize}px;padding-top:${p.benefitHeight}px;padding-bottom:${p.benefitHeight}px}.barcode{height:${p.barcodeHeight}px}.qr{flex-basis:${p.qrWidth}%}`}
function updateLayout(key,value){if(!editing)return;layout=normalizeLayout({...layout,[key]:Number(value)});applyLayout();clearTimeout(layoutTimer);layoutTimer=setTimeout(()=>{savePatch({layout:{...layout}}).catch(()=>{})},500)}
function renderLayoutFields(){const fields=$('layoutFields');fields.replaceChildren();for(const [key,label,section,def,min,max,step,unit]of layoutDefinitions){if(section!==layoutSection)continue;const row=document.createElement('div');row.className='layout-control';const labelEl=document.createElement('label');labelEl.htmlFor='layout-range-'+key;labelEl.textContent=label+' ('+unit+')';const number=document.createElement('input');number.type='number';number.className='layout-number';number.min=min;number.max=max;number.step=step;number.value=Number(layout[key].toFixed(2));number.setAttribute('aria-label',label+' 수치');const range=document.createElement('input');range.id='layout-range-'+key;range.type='range';range.className='layout-range';range.min=min;range.max=max;range.step=step;range.value=layout[key];range.addEventListener('input',()=>{updateLayout(key,range.value);number.value=Number(layout[key].toFixed(2))});number.addEventListener('change',()=>{if(number.value===''){number.value=layout[key];return}updateLayout(key,number.value);number.value=Number(layout[key].toFixed(2));range.value=layout[key]});row.append(labelEl,number,range);fields.appendChild(row)}fields.scrollTop=0;for(const id of ['layoutTabHeader','layoutTabText','layoutTabCard'])$(id).setAttribute('aria-selected',String($(id).dataset.section===layoutSection));fields.setAttribute('aria-labelledby',layoutSection==='header'?'layoutTabHeader':layoutSection==='text'?'layoutTabText':'layoutTabCard')}
function openLayout(){if(!editing)return;$('layoutPanel').hidden=false;document.querySelector('.app').classList.add('layout-editing');renderLayoutFields()}
async function closeLayout(){if(editing){clearTimeout(layoutTimer);try{await savePatch({layout:{...layout}})}catch{return}}$('layoutPanel').hidden=true;document.querySelector('.app').classList.remove('layout-editing')}
$('closeLayout').addEventListener('click',closeLayout);$('layoutTrigger').addEventListener('click',openLayout);$('layoutTrigger').addEventListener('keydown',e=>{if(editing&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openLayout()}});
for(const id of ['layoutTabHeader','layoutTabText','layoutTabCard'])$(id).addEventListener('click',()=>{layoutSection=$(id).dataset.section;renderLayoutFields()});
$('resetLayout').addEventListener('click',async()=>{if(!editing)return;layout={...layoutDefaults};applyLayout();renderLayoutFields();try{await savePatch({layout:{...layout}});toast('기본 크기가 저장되었습니다.')}catch{}});
renderProfile();const profileReady=loadProfile();document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(!editing)loadProfile()}});
let pullOrigin = null;
let pullAmount = 0;
let pullRefreshing = false;

function clearPull() {
  pullOrigin = null;
  pullAmount = 0;
}

document.addEventListener('touchstart', e => {
  clearPull();

  if (pullRefreshing || e.touches.length !== 1) return;
  if (window.scrollY > 2) return;

  // 글씨 입력과 설정창 조작은 제외
  if (e.target.closest(
    'input, textarea, [contenteditable="plaintext-only"], .layout-panel'
  )) return;
  if (document.querySelector('dialog[open]')) return;

  pullOrigin = {
    x: e.touches[0].clientX,
    y: e.touches[0].clientY
  };
}, { passive: true, capture: true });

document.addEventListener('touchmove', e => {
  if (!pullOrigin) return;

  if (e.touches.length !== 1 || window.scrollY > 2) {
    clearPull();
    return;
  }

  const dx = e.touches[0].clientX - pullOrigin.x;
  const dy = e.touches[0].clientY - pullOrigin.y;

  if (dy < 0 || Math.abs(dx) > Math.abs(dy)) {
    clearPull();
    return;
  }

  pullAmount = dy;
}, { passive: true, capture: true });

document.addEventListener('touchend', e => {
  const ready =
    pullOrigin !== null &&
    e.touches.length === 0 &&
    pullAmount >= 90;

  clearPull();
  if (!ready || pullRefreshing) return;

  pullRefreshing = true;

  // 튕겨 돌아오는 움직임을 잠깐 보여준 후 새로고침
  setTimeout(async () => {
    try {
      await reloadPage();
    } finally {
      pullRefreshing = false;
    }
  }, 250);
}, { passive: true, capture: true });

document.addEventListener('touchcancel', clearPull, {
  passive: true,
  capture: true
});
</script>
